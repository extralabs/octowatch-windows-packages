Description: |-
  OctoWatch Server installs the On-Premise control plane for OctoWatch DLP — Admin Console, monitoring services, and Web Console hosting on your Windows infrastructure.

  Use it when regulated teams need workforce activity visibility and endpoint DLP with data staying on customer servers. After Server setup, deploy Windows Grabbers from the console workflow. Microsoft SQL Server 2014+ is required separately. Setup may need internet access so Windows can enable IIS features via DISM.

  Commercial shareware with a free trial from the vendor download page. Not affiliated with Octo Browser.
